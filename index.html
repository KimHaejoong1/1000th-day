<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>모으령의 1000번째 날 ✨</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Galmuri11:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --gold:#ffd23f;
    --gold-deep:#f7a900;
    --neon:#ffe85c;
    --purple:#7d3cff;
    --bg:#0a0a12;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    height:100%;
    background:
      radial-gradient(circle at 50% 20%, #15102b 0%, #0a0a12 60%, #050507 100%);
    overflow:hidden;
    font-family:'Press Start 2P','Galmuri11',monospace;
    color:#fff;
    -webkit-font-smoothing:none;
    image-rendering:pixelated;
  }
  body{
    display:flex; align-items:center; justify-content:center;
    touch-action:none;
  }
  #wrap{
    position:relative;
    width:min(96vw, 720px, 72vh);
    aspect-ratio:480/640;
    box-shadow:0 0 0 4px #000, 0 0 0 8px var(--gold-deep), 0 0 40px rgba(255,210,63,.4);
    background:#000;
    border-radius:6px;
    overflow:hidden;
  }
  canvas{
    display:block;
    width:100%; height:100%;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    cursor:crosshair;
  }

  /* ---------- Overlays ---------- */
  .overlay{
    position:absolute; inset:0;
    display:none;
    flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center;
    padding:24px;
    background:rgba(5,5,10,.92);
    z-index:5;
    gap:18px;
  }
  .overlay.show{ display:flex; }

  .title-logo{
    font-size:clamp(14px,4.4vw,22px);
    color:var(--gold);
    line-height:1.6;
    text-shadow:3px 3px 0 #7a4d00, 0 0 18px rgba(255,210,63,.6);
    animation:bob 2s ease-in-out infinite;
  }
  @keyframes bob{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }

  .sub{
    font-family:'Galmuri11',monospace;
    font-size:13px; color:#cfc7ff; line-height:1.8;
  }
  .blink{ animation:blink 1s steps(2,start) infinite; }
  @keyframes blink{ 50%{opacity:0} }

  .btn{
    font-family:'Press Start 2P',monospace;
    font-size:11px;
    color:#1a1208;
    background:linear-gradient(#ffe16b,var(--gold-deep));
    border:none;
    padding:14px 18px;
    border-radius:4px;
    box-shadow:0 4px 0 #9a6b00, 0 0 14px rgba(255,210,63,.5);
    cursor:pointer;
    letter-spacing:.5px;
    transition:transform .05s, box-shadow .05s;
  }
  .btn:active{ transform:translateY(3px); box-shadow:0 1px 0 #9a6b00; }
  .btn.small{ font-size:8px; padding:9px 11px; }
  .btn.ghost{
    background:#1b1530; color:#ffe16b;
    box-shadow:0 4px 0 #0c0a1a;
    border:2px solid var(--gold-deep);
  }
  .btn:disabled{ filter:grayscale(.8) brightness(.6); cursor:not-allowed; box-shadow:0 4px 0 #555; }

  /* ---------- Shop ---------- */
  #shop .panel{
    width:100%; max-width:420px;
    background:#120e22;
    border:3px solid var(--gold-deep);
    border-radius:8px;
    padding:18px 16px;
    box-shadow:0 0 24px rgba(125,60,255,.25), inset 0 0 0 2px #000;
  }
  #shop h2{
    font-size:13px; color:var(--gold); margin-bottom:6px;
    text-shadow:2px 2px 0 #5a3b00;
  }
  .shop-coins{
    font-family:'Press Start 2P',monospace;
    font-size:12px; color:var(--neon); margin:10px 0 16px;
  }
  .up-row{
    display:flex; align-items:center; gap:10px;
    background:#0c0918; border:2px solid #2a2150;
    border-radius:6px; padding:10px; margin-bottom:10px;
    text-align:left;
  }
  .up-icon{ font-size:22px; width:34px; text-align:center; }
  .up-icon-img{ width:34px; height:34px; object-fit:contain; image-rendering:pixelated; flex:0 0 auto; }
  .up-info{ flex:1; }
  .up-name{ font-size:9px; color:#fff; line-height:1.5; }
  .up-desc{ font-family:'Galmuri11',monospace; font-size:11px; color:#a99fe0; margin-top:4px; }
  .up-lv{ font-family:'Galmuri11',monospace; font-size:11px; color:var(--gold); margin-top:3px; }

  /* ---------- Letter ---------- */
  #letter{ background:rgba(5,5,10,.4); }
  .card{
    width:100%; max-width:430px;
    background:
      linear-gradient(160deg,#fff8e6 0%, #ffeebd 100%);
    color:#5a3b00;
    border-radius:14px;
    padding:26px 22px 24px;
    box-shadow:0 0 0 4px #fff, 0 0 0 9px var(--gold-deep), 0 18px 50px rgba(0,0,0,.6);
    position:relative;
    transform:scale(.7); opacity:0;
    animation:cardIn .8s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  @keyframes cardIn{ to{ transform:scale(1); opacity:1; } }
  .card .seal{
    position:absolute; top:-22px; left:50%; transform:translateX(-50%);
    font-size:34px; filter:drop-shadow(0 3px 4px rgba(0,0,0,.3));
  }
  .card h3{
    font-family:'Press Start 2P',monospace;
    font-size:13px; color:var(--gold-deep);
    text-align:center; margin:10px 0 4px; letter-spacing:1px;
    text-shadow:1px 1px 0 #fff;
  }
  .card .date{
    font-family:'Galmuri11',monospace; text-align:center;
    font-size:12px; color:#b07d10; margin-bottom:16px; font-weight:700;
  }
  .card p{
    font-family:'Galmuri11',monospace;
    font-size:15px; line-height:2; color:#4a3000;
    white-space:pre-wrap;
  }
  .card .from{
    margin-top:18px; text-align:right;
    font-family:'Galmuri11',monospace; font-size:14px; font-weight:700; color:#8a5b00;
  }
  .card .heart{ text-align:center; font-size:20px; margin-top:14px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="480" height="640"></canvas>

  <!-- TITLE -->
  <div id="title" class="overlay show">
    <div class="title-logo">모으령의<br />1000번째 날</div>
    <div class="sub">
      하늘에서 떨어지는 코인을 모으자!<br />
      ⚠ 장애물에 닿으면 끝! (보호막으로 방어)<br />
      시간이 지날수록 점점 빨라져요<br /><br />
      999개를 채우면… ✨ 무슨 일이?<br />
      ← → 또는 화면을 움직여 조종!
    </div>
    <button class="btn" id="startBtn">▶ 게임 시작</button>
    <button class="btn ghost small" id="resetBtn">처음부터 (저장 초기화)</button>
  </div>

  <!-- SHOP -->
  <div id="shop" class="overlay">
    <div class="panel">
      <h2>⚙ 업그레이드 상점</h2>
      <div class="shop-coins" id="shopCoins">COINS 0 / 999</div>
      <div id="upgrades"></div>
    </div>
    <button class="btn" id="nextRoundBtn">강화 완료! 다시 도전 ▶</button>
  </div>

  <!-- LETTER -->
  <div id="letter" class="overlay">
    <div class="card">
      <div class="seal">💛</div>
      <h3 id="ltTitle"></h3>
      <div class="date" id="ltDate"></div>
      <p id="ltBody"></p>
      <div class="from" id="ltFrom"></div>
      <div class="heart">💛 🪙 💛</div>
    </div>
    <button class="btn ghost small" id="replayBtn">다시 보기</button>
  </div>

  <!-- EVOLVE button (shown during ending) -->
  <button class="btn" id="evolveBtn"
    style="position:absolute; left:50%; bottom:14%; transform:translateX(-50%); display:none; z-index:7; font-size:13px;">
    ⚡ 진화하기
  </button>
</div>

<script>
/* =========================================================================
   ❤️  여기를 수정해서 편지 내용을 바꾸세요  ❤️

이렇게 반짝이는 보물이 됐네.

앞으로의 날들도
한 칸씩 천천히, 가득 채워가자.

  from: "— 언제나 너의 편, 💛"

const SPR = {};
let spritesReady = false;
(function loadSprites(){
  const keys = Object.keys(SPRITE_SRC);
  let n = 0;
  const done = ()=>{ if(++n >= keys.length) spritesReady = true; };
  keys.forEach(k=>{
    const im = new Image();
    im.onload = done; im.onerror = done;
    im.src = SPRITE_SRC[k];
    SPR[k] = im;
  });
})();
function ready(img){ return img && img.complete && img.naturalWidth>0; }

/* draw a solid-color silhouette of an image (for evolution scene) */
const _silCv=document.createElement('canvas');
const _silCtx=_silCv.getContext('2d');
function drawSilhouette(img,cx,cy,h,color){
  if(!ready(img)) return;
  const ratio=img.naturalWidth/img.naturalHeight, w=h*ratio;
  _silCv.width=Math.max(1,Math.ceil(w)); _silCv.height=Math.max(1,Math.ceil(h));
  _silCtx.clearRect(0,0,_silCv.width,_silCv.height);
  _silCtx.globalCompositeOperation='source-over';
  _silCtx.drawImage(img,0,0,w,h);
  _silCtx.globalCompositeOperation='source-in';
  _silCtx.fillStyle=color; _silCtx.fillRect(0,0,_silCv.width,_silCv.height);
  ctx.drawImage(_silCv, cx-w/2, cy-h/2, w, h);
}

/* ---------------- Persistent state ---------------- */
const SAVE_KEY = 'gimmighoul1000_v1';
let save = loadSave();
function loadSave(){
  try{
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if(s && typeof s.total==='number') return s;
  }catch(e){}
  return { total:0, multLevel:0, shieldLevel:0, round:1 };
}
function persist(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }

/* ---------------- Audio (Web Audio API — fully synthesized, no files) ---------------- */
let AC=null, masterGain=null, bgm=null;
function audioInit(){
  if(!AC){
    try{
      AC = new (window.AudioContext||window.webkitAudioContext)();
      masterGain = AC.createGain();
      masterGain.gain.value = 0.5;
      masterGain.connect(AC.destination);
    }catch(e){ AC=null; }
  }
  if(AC && AC.state==='suspended') AC.resume();
}
function beep(freq, start, dur, type, vol){
  if(!AC) return;
  const t0=AC.currentTime+start;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(freq,t0);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol||0.2, t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g).connect(masterGain);
  o.start(t0); o.stop(t0+dur+0.03);
}
function sfxCoin(){ audioInit(); beep(988,0,0.07,'square',0.16); beep(1319,0.05,0.11,'square',0.15); }
function sfxShield(){ audioInit(); beep(660,0,0.08,'triangle',0.20); beep(990,0.06,0.12,'triangle',0.18); }
function sfxHit(){ audioInit(); beep(170,0,0.20,'sawtooth',0.25); beep(100,0.09,0.30,'sawtooth',0.22); }

function startBGM(notes, type, vol){
  audioInit(); stopBGM();
  if(!AC) return;
  const len = notes.reduce((s,n)=>s+n[1],0);
  const handle = { active:true, timer:null };
  function once(){
    if(!handle.active) return;
    let t=0;
    for(const [f,d] of notes){ if(f>0) beep(f,t,d*0.9,type||'square',vol||0.12); t+=d; }
    handle.timer=setTimeout(once, len*1000);
  }
  bgm=handle; once();
}
function stopBGM(){ if(bgm){ bgm.active=false; clearTimeout(bgm.timer); bgm=null; } }

// evolving: tense rising loop ; victory: triumphant fanfare loop
const BGM_EVOLVE  = [[784,0.13],[880,0.13],[988,0.13],[880,0.13],[784,0.13],[988,0.13],[1047,0.13],[988,0.13]];
const BGM_VICTORY = [[523,0.16],[659,0.16],[784,0.16],[1047,0.34],[988,0.16],[784,0.16],[1047,0.52],[0,0.18],
                     [880,0.16],[1047,0.16],[1319,0.52],[0,0.34]];

/* ---------------- Time-based difficulty scaling (per run) ---------------- */
function diffCfg(t){
  return {
    spawnEvery: Math.max(0.32, 0.85 - t*0.012),    // spawns get faster over time
    fall:       130 + t*7,                           // coins/obstacles fall faster
    obstacleP:  Math.min(0.42, 0.07 + t*0.005)       // more obstacles over time
  };
}

function canvasPos(clientX, clientY){
  const r = cv.getBoundingClientRect();
  return {

    y:(clientY - r.top)  * (H / r.height)
  };
}

function handleClick(cx, cy){
  if(state==='ending' && endPhase==='prompt'){

function startRound(){

  objects=[]; particles=[]; floaters=[];

/* run ends when hit by an obstacle with no shield left */
function endRun(){

  state='gameover';

function openShop(){
  state='shop';
  renderShop();
  showOverlay(elShop);
}

function renderShop(){
  document.getElementById('shopCoins').textContent = `COINS ${save.total} / 999`;
  const wrap=document.getElementById('upgrades');
  wrap.innerHTML='';

  // Coin Multiplier
  const mNext = save.multLevel < MULT_COSTS.length ? MULT_COSTS[save.multLevel] : null;
  wrap.appendChild(upRow({
    iconImg: SPRITE_SRC.coin,
    name:`COIN MULTIPLIER  Lv.${save.multLevel}`,
    desc:'코인 하나의 가치를 올려요',
    lv:`현재: 코인당 +${coinValue()}` + (mNext!==null?` → +${COIN_VALUES[save.multLevel+1]}`:'  (MAX)'),
    cost:mNext,
    can: mNext!==null && save.total>=mNext,
    maxed: mNext===null,
    buy:()=>{ save.total-=mNext; save.multLevel++; persist(); renderShop(); }
  }));

  // Shield
  const sNext = save.shieldLevel < SHIELD_MAX ? SHIELD_COSTS[save.shieldLevel] : null;
  wrap.appendChild(upRow({
    icon:'🛡️',
    name:`SHIELD  Lv.${save.shieldLevel}`,
    desc:'장애물을 막아줘요 (매 판 자동 충전)',
    lv:`현재: ${save.shieldLevel}번 방어` + (sNext!==null?` → ${save.shieldLevel+1}번`:'  (MAX)'),
    cost:sNext,
    can: sNext!==null && save.total>=sNext,
    maxed: sNext===null,
    buy:()=>{ save.total-=sNext; save.shieldLevel++; persist(); renderShop(); }
  }));
}

function upRow(o){
  const row=document.createElement('div'); row.className='up-row';
  const iconHtml = o.iconImg
    ? `<img class="up-icon-img" src="${o.iconImg}" alt="coin">`
    : `<div class="up-icon">${o.icon}</div>`;
  row.innerHTML = iconHtml + `
    <div class="up-info">
      <div class="up-name">${o.name}</div>
      <div class="up-desc">${o.desc}</div>
      <div class="up-lv">${o.lv}</div>
    </div>`;
  const btn=document.createElement('button');
  btn.className='btn small';
  if(o.maxed){ btn.textContent='MAX'; btn.disabled=true; }
  else{
    btn.textContent=`${o.cost}🪙`;
    btn.disabled=!o.can;
    btn.onclick=o.buy;
  }
  row.appendChild(btn);
  return row;
}

/* =========================================================================
   SPAWNING / GAMEPLAY
   ========================================================================= */
function spawnObject(){
  const cfg=diffCfg(elapsed);
  const isObstacle = Math.random() < cfg.obstacleP;
  const size = isObstacle ? 38 : 30;
  objects.push({
    type: isObstacle ? (Math.random()<0.5?'rock':'bomb') : 'coin',
    x: 30 + Math.random()*(W-60),
    y: -size,
    vy: cfg.fall*(0.85+Math.random()*0.4),
    size,
    rot: Math.random()*Math.PI*2,
    vr:(Math.random()-0.5)*0.12
  });
}

function addCoins(n){
  const before=save.total;
  save.total=Math.min(999, save.total+n);
  persist();
  if(before<999 && save.total>=999){ startEnding(); }
}

function gainScore(x,y){
  const v=coinValue();
  addCoins(v);
  sfxCoin();
  floaters.push({x,y,t:0,txt:`+${v}`,color:'#ffe85c'});
  for(let i=0;i<8;i++) particles.push(sparkle(x,y,'#ffe85c'));
}

function hitObstacle(x,y){
  if(shieldCharges>0){
    shieldCharges--;
    sfxShield();
    shake=8;
    floaters.push({x,y,t:0,txt:'BLOCK!',color:'#6cf0ff'});
    for(let i=0;i<12;i++) particles.push(sparkle(x,y,'#6cf0ff'));
    return;
  }
  // no shield left -> run is over
  sfxHit();
  shake=20;
  player.stun=1.0;
  for(let i=0;i<24;i++) particles.push(sparkle(x,y,'#ff5a7a'));
  endRun();
}

function sparkle(x,y,color){
  const a=Math.random()*Math.PI*2, s=40+Math.random()*120;
  return { x,y, vx:Math.cos(a)*s, vy:Math.sin(a)*s-40, life:0, max:0.5+Math.random()*0.4, color, size:2+Math.random()*3 };
}

function spawnRainBurst(n){
  for(let i=0;i<n;i++){
    particles.push({

/* =========================================================================
   UPDATE
   ========================================================================= */
let last=performance.now();
function loop(now){
  let dt=(now-last)/1000; last=now;
  if(dt>0.05) dt=0.05;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function update(dt){
  if(shake>0) shake=Math.max(0,shake-dt*40);
  if(flashWhite>0) flashWhite=Math.max(0,flashWhite-dt*1.5);

  // sparkle particles
  for(const p of particles){
    p.life+=dt;
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(!p.coin) p.vy+=200*dt; else p.vy+=120*dt;
    if(p.rot!==undefined) p.rot+=p.vr;
  }
  particles=particles.filter(p=> p.coin ? p.y<H+30 : p.life<p.max);

  for(const f of floaters){ f.t+=dt; f.y-=28*dt; }
  floaters=floaters.filter(f=>f.t<0.9);

  if(state==='playing') updatePlay(dt);
  else if(state==='gameover'){
    goTimer+=dt;
    if(goTimer>1.4){ save.round++; persist(); openShop(); }
  }
  else if(state==='ending') updateEnding(dt);
}

function updatePlay(dt){
  elapsed+=dt;

  // movement (keyboard)
  const sp=380;
  if(keys.ArrowLeft||keys.a)  player.x-=sp*dt;
  if(keys.ArrowRight||keys.d) player.x+=sp*dt;
  player.x=Math.max(player.w/2, Math.min(W-player.w/2, player.x));

  // spawn (rate scales with time survived)
  spawnAcc+=dt;
  const cfg=diffCfg(elapsed);
  if(spawnAcc>=cfg.spawnEvery){ spawnAcc=0; spawnObject(); }

  // move objects + collide
  const px=player.x-player.w/2, py=player.y-player.h/2;
  for(const o of objects){
    o.y+=o.vy*dt; o.rot+=o.vr;
    const hit = o.x > px-6 && o.x < px+player.w+6 &&
                o.y+o.size/2 > py+10 && o.y-o.size/2 < py+player.h;
    if(hit && !o.dead){
      o.dead=true;
      if(o.type==='coin') gainScore(o.x,o.y);
      else { hitObstacle(o.x,o.y); if(state!=='playing') return; }   // run may have ended
    }
  }
  objects=objects.filter(o=> !o.dead && o.y < H+o.size);
}

function updateEnding(dt){
  endTimer+=dt;
  if(endPhase==='prompt'){
    // waiting for click on the 1000th coin
  }else if(endPhase==='preEvolve'){
    // waiting for the 진화하기 button (DOM)
  }else if(endPhase==='evolving'){
    // silhouette toggles back and forth, speeding up; white light behind
    const interval = Math.max(0.07, 0.40 - endTimer*0.065);
    evoAcc+=dt;
    if(evoAcc>=interval){ evoAcc=0; evoShow=!evoShow; }
    if(Math.random()<0.4) particles.push(sparkle(W/2+(Math.random()-0.5)*150, H/2+(Math.random()-0.5)*170,'#ffffff'));
    if(endTimer>4.4){
      endPhase='reveal'; endTimer=0;
      flashWhite=1;
      stopBGM(); startBGM(BGM_VICTORY,'square',0.12);   // 진화 완료 브금
    }
  }else if(endPhase==='reveal'){
    if(Math.random()<0.5) particles.push(sparkle(W/2+(Math.random()-0.5)*130, H/2-20+(Math.random()-0.5)*130,'#ffe85c'));
    if(endTimer>2.6){
      endPhase='rain'; endTimer=0;
      gold={ x:-160, y:H-150, vx:150 };
      spawnRainBurst(80);
    }
  }else if(endPhase==='rain'){
    if(Math.random()<0.9) spawnRainBurst(2);
    if(gold){ gold.x+=gold.vx*dt; if(gold.x>W/2){ gold.x=W/2; gold.vx*=0.86; } }
    if(endTimer>3.6){
      endPhase='done';
      fillLetter();
      showOverlay(elLetter);
    }
  }else if(endPhase==='done'){
    if(Math.random()<0.5) spawnRainBurst(1);   // keep gentle rain behind card
  }
}

function fillLetter(){
  document.getElementById('ltTitle').textContent = ANNIVERSARY_MESSAGE.title;
  document.getElementById('ltDate').textContent  = ANNIVERSARY_MESSAGE.date;
  document.getElementById('ltBody').textContent  = ANNIVERSARY_MESSAGE.body;
  document.getElementById('ltFrom').textContent  = ANNIVERSARY_MESSAGE.from;
}

/* =========================================================================
   RENDER
   ========================================================================= */
let bgStars=[];
for(let i=0;i<60;i++) bgStars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+0.5,tw:Math.random()*Math.PI*2});

function render(){
  ctx.save();
  if(shake>0) ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);

  // background
  ctx.fillStyle='#0a0a12'; ctx.fillRect(-20,-20,W+40,H+40);
  drawBackground();

  if(state==='playing' || state==='shop' || state==='gameover') drawScene();
  if(state==='ending') drawEnding();

  drawParticles();
  drawFloaters();

  if(state==='playing' || state==='gameover') drawHUD();
  if(state==='gameover') drawGameOver();

  ctx.restore();

  if(flashWhite>0){
    ctx.fillStyle=`rgba(255,255,255,${flashWhite})`;
    ctx.fillRect(0,0,W,H);
  }
}

function drawBackground(){
  ctx.save();
  for(const s of bgStars){
    s.tw+=0.03;
    const a=0.3+0.3*Math.sin(s.tw);
    ctx.fillStyle=`rgba(255,235,140,${a})`;
    ctx.fillRect(s.x,s.y,s.s,s.s);
  }
  // faint grid floor near bottom
  ctx.strokeStyle='rgba(125,60,255,0.10)';
  ctx.lineWidth=1;
  for(let y=H-120;y<H;y+=18){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  ctx.restore();
}

function drawScene(){
  // falling objects
  for(const o of objects){
    if(o.type==='coin') drawCoin(o.x,o.y,o.size,o.rot);
    else if(o.type==='rock') drawRock(o.x,o.y,o.size,o.rot);
    else drawBomb(o.x,o.y,o.size,o.rot);
  }
  // player
  const blink = player.stun>0 && Math.floor(player.stun*12)%2===0;
  if(!blink) drawGimmighoul(player.x, player.y, 64);
  if(shieldCharges>0) drawShield(player.x, player.y, 64, shieldCharges);
}

function drawHUD(){
  ctx.fillStyle='#1c1530'; ctx.fillRect(0,0,W,38);
  ctx.fillStyle='#ffd23f';
  ctx.fillRect(0,38,W,2);

  ctx.textBaseline='middle';
  ctx.font="10px 'Press Start 2P','Galmuri11',monospace";
  // coins
  drawCoin(20,19,18,0);
  ctx.fillStyle='#ffe85c'; ctx.textAlign='left';
  ctx.fillText(`${save.total}/999`, 36, 20);
  // run number
  ctx.textAlign='center';
  ctx.fillStyle='#fff';
  ctx.fillText(`판 ${save.round}`, W/2, 20);

  ctx.textAlign='right';
  if(shieldCharges>0){
    ctx.fillStyle='#6cf0ff';
    ctx.fillText(`방어 x${shieldCharges}`, W-12, 20);

    ctx.fillStyle='#ff7a90';
    ctx.fillText(`무방비!`, W-12, 20);
  }
}

function drawGameOver(){
  ctx.fillStyle='rgba(10,6,18,0.66)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#ff5a7a';

function drawEnding(){
  // ---- evolving: white light backdrop + silhouette toggle ----
  if(endPhase==='evolving'){
    const a=0.55+0.35*Math.sin(endTimer*7);
    const g=ctx.createRadialGradient(W/2,H/2,8, W/2,H/2,380);
    g.addColorStop(0,`rgba(255,255,255,${Math.min(1,a)})`);
    g.addColorStop(0.45,'rgba(255,244,190,0.55)');
    g.addColorStop(1,'rgba(8,6,18,0.96)');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

    const img = evoShow ? SPR.gimmighoul : SPR.gholdengo;
    drawSilhouette(img, W/2, H/2, evoShow?150:168, '#241a40');

    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='#8a5b00';
    ctx.font="13px 'Press Start 2P','Galmuri11',monospace";
    ctx.fillText("오잉? 모으령의 상태가..?", W/2, 92);
    return;
  }

  ctx.fillStyle='rgba(8,6,18,0.82)'; ctx.fillRect(0,0,W,H);

  if(endPhase==='prompt'){
    const pulse=1+0.06*Math.sin(performance.now()/220);
    drawGiantCoin(W/2, H/2, 80*pulse);
    ctx.save();
    ctx.strokeStyle=`rgba(255,232,92,${0.3+0.3*Math.sin(performance.now()/300)})`;
    ctx.lineWidth=4;
    ctx.beginPath(); ctx.arc(W/2,H/2,92*pulse,0,Math.PI*2); ctx.stroke();
    ctx.restore();

    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='#ffd23f';
    ctx.font="12px 'Press Start 2P','Galmuri11',monospace";
    ctx.fillText("우리의 1000번째 날,", W/2, H/2-180);
    ctx.fillText("마지막 코인을 채워줘!", W/2, H/2-150);
    ctx.fillStyle='#fff';
    ctx.font="10px 'Galmuri11',monospace";
    ctx.globalAlpha=0.4+0.6*(0.5+0.5*Math.sin(performance.now()/300));
    ctx.fillText("👆 코인을 클릭!", W/2, H/2+150);
    ctx.globalAlpha=1;

  }else if(endPhase==='preEvolve'){
    const bob=Math.sin(performance.now()/300)*6;
    drawGimmighoul(W/2, H/2+bob, 150);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='#ffd23f';
    ctx.font="13px 'Press Start 2P','Galmuri11',monospace";
    ctx.fillText("오잉? 모으령의 상태가..?", W/2, H/2-150);
    // (진화하기 버튼은 DOM 으로 표시됨)

  }else if(endPhase==='reveal'){
    const bob=Math.sin(performance.now()/240)*5;
    drawGholdengo(W/2, H/2+bob, 150);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='#ffe85c';
    ctx.font="13px 'Press Start 2P','Galmuri11',monospace";
    ctx.fillText("모으령은 타부자고로", W/2, H/2-168);
    ctx.fillText("진화했다!", W/2, H/2-138);

  }else{
    // rain / done : gold wave + surfing gholdengo
    drawGoldWave();
    if(gold) drawGholdengoSurf(gold.x, gold.y);
    ctx.textAlign='center';
    ctx.fillStyle='#ffe85c';
    ctx.font="13px 'Press Start 2P','Galmuri11',monospace";
    ctx.fillText("✨ 골드러시! ✨", W/2, 70);
    ctx.fillStyle='#fff';
    ctx.font="11px 'Galmuri11',monospace";
    ctx.fillText("타부자고로 진화했다!", W/2, 96);
  }
}

function wrapText(text,x,y,maxW,lh){
  // simple: assume short; just draw centered
  ctx.fillText(text,x,y);
}

function drawParticles(){
  for(const p of particles){
    if(p.coin){ drawCoin(p.x,p.y,p.size,p.rot||0); }
    else{
      const a=1-p.life/p.max;
      ctx.globalAlpha=Math.max(0,a);
      ctx.fillStyle=p.color;
      ctx.fillRect(p.x,p.y,p.size,p.size);
      ctx.globalAlpha=1;
    }
  }
}
function drawFloaters(){
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const f of floaters){
    ctx.globalAlpha=Math.max(0,1-f.t/0.9);
    ctx.fillStyle=f.color;
    ctx.font="10px 'Press Start 2P','Galmuri11',monospace";
    ctx.fillText(f.txt,f.x,f.y);
  }
  ctx.globalAlpha=1;
}

/* =========================================================================
   PIXEL SPRITES (drawn with Canvas, no external assets)
   ========================================================================= */
function px(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h)); }

/* --- fallback coin (used until sprite loads) --- */
function fallbackCoin(r){
  ctx.fillStyle='#a86a00'; ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#ffd23f'; ctx.beginPath(); ctx.arc(0,0,r*0.82,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff0a8'; ctx.beginPath(); ctx.arc(0,0,r*0.55,0,Math.PI*2); ctx.fill();
}

/* --- Coin (sprite) : `size` = diameter, `spin` = phase for coin-flip squash --- */
function drawCoin(cx,cy,size,spin){
  const img=SPR.coin;
  const sx=0.5+0.5*Math.abs(Math.cos(spin||0));   // horizontal squash = spinning feel
  ctx.save(); ctx.translate(cx,cy); ctx.scale(sx,1);
  if(ready(img)){
    const ratio=img.naturalWidth/img.naturalHeight;
    const h=size, w=size*ratio;
    ctx.drawImage(img,-w/2,-h/2,w,h);
  }else{ fallbackCoin(size/2); }
  ctx.restore();
}

function drawGiantCoin(cx,cy,r){
  const img=SPR.coin;
  const t=performance.now()/600;
  ctx.save();
  ctx.shadowColor='rgba(255,210,63,0.9)'; ctx.shadowBlur=46;
  if(ready(img)){
    const ratio=img.naturalWidth/img.naturalHeight;
    const h=r*2.2, w=h*ratio;
    ctx.drawImage(img,cx-w/2,cy-h/2,w,h);
    ctx.shadowBlur=0;
    // "1000" overlay
    ctx.fillStyle='#7a4d00';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font=`${Math.floor(r*0.42)}px 'Press Start 2P',monospace`;
    ctx.fillText('1000',cx,cy+2);
  }else{
    ctx.fillStyle='#ffd23f'; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
  }
  ctx.fillStyle='rgba(255,255,255,'+(0.6+0.4*Math.sin(t*3))+')';
  ctx.fillRect(cx-r*0.5,cy-r*0.6,6,6);
  ctx.fillRect(cx+r*0.4,cy-r*0.3,4,4);
  ctx.restore();
}

/* --- Gimmighoul (sprite) --- */
function drawGimmighoul(cx,cy,size){
  const img=SPR.gimmighoul;
  if(ready(img)){
    const ratio=img.naturalWidth/img.naturalHeight;
    const h=size*1.25, w=h*ratio;
    ctx.drawImage(img, cx-w/2, cy-h/2, w, h);
  }else{
    px(cx-size/2,cy-size/2,size,size,'#6b6f9a');
  }
}

function drawShield(cx,cy,size,charges){
  ctx.save();
  const r=size*0.62;
  const a=0.35+0.2*Math.sin(performance.now()/200);
  ctx.strokeStyle=`rgba(108,240,255,${a+0.3})`;
  ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle=`rgba(108,240,255,${a*0.25})`;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  // charge dots
  for(let i=0;i<charges;i++){
    ctx.fillStyle='#6cf0ff';
    ctx.fillRect(cx-6+i*9, cy-r-8, 5,5);
  }
  ctx.restore();
}

/* --- Gholdengo (sprite) --- */
function drawGholdengo(cx,cy,size){
  const img=SPR.gholdengo;
  ctx.save();
  ctx.shadowColor='rgba(255,210,63,0.6)'; ctx.shadowBlur=size*0.18;
  if(ready(img)){
    const ratio=img.naturalWidth/img.naturalHeight;
    const h=size*1.4, w=h*ratio;
    ctx.drawImage(img, cx-w/2, cy-h/2, w, h);
  }else{
    px(cx-size/2,cy-size/2,size,size*1.4,'#ffd23f');
  }
  ctx.restore();
}

function drawGholdengoSurf(cx,cy){
  const img=SPR.surf;
  const bob=Math.sin(performance.now()/180)*4;
  ctx.save();
  if(ready(img)){
    const ratio=img.naturalWidth/img.naturalHeight;
    const h=150, w=h*ratio;
    ctx.drawImage(img, cx-w/2, cy-h/2+bob, w, h);
  }else{
    drawGholdengo(cx,cy+bob,78);
  }
  // water spray sparkles trailing behind
  ctx.fillStyle='rgba(255,255,255,0.85)';
  for(let i=0;i<5;i++) ctx.fillRect(cx-80+Math.random()*24, cy+30+Math.random()*26, 3,3);
  ctx.restore();
}

function drawGoldWave(){
  ctx.save();
  const t=performance.now()/400;
  for(let layer=0; layer<3; layer++){
    const baseY=H-70+layer*24;
    const cols=['#f7a900','#ffd23f','#ffe16b'][layer];
    ctx.fillStyle=cols;
    ctx.beginPath();
    ctx.moveTo(0,H);
    for(let xx=0; xx<=W; xx+=12){
      const yy=baseY + Math.sin(xx/40 + t + layer)*8;
      ctx.lineTo(xx,yy);
    }
    ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

/* --- Obstacles --- */
function drawRock(cx,cy,size,rot){
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(rot*0.3);
  const r=size/2;
  ctx.fillStyle='#7d3cff';
  ctx.beginPath();
  ctx.moveTo(0,-r);
  ctx.lineTo(r*0.9,-r*0.3);
  ctx.lineTo(r*0.7,r*0.8);
  ctx.lineTo(-r*0.6,r*0.9);
  ctx.lineTo(-r*0.95,-r*0.1);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle='#5a26b8';
  ctx.fillRect(-r*0.3,-r*0.2,r*0.5,r*0.5);
  ctx.fillStyle='#a06bff';
  ctx.fillRect(-r*0.5,-r*0.55,r*0.25,r*0.25);
  ctx.restore();
}
function drawBomb(cx,cy,size,rot){
  ctx.save(); ctx.translate(cx,cy);
  const r=size/2;
  ctx.fillStyle='#1a1426';
  ctx.beginPath(); ctx.arc(0,r*0.1,r*0.85,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#3a2f55'; ctx.beginPath(); ctx.arc(-r*0.3,-r*0.2,r*0.25,0,Math.PI*2); ctx.fill();
  // fuse
  ctx.strokeStyle='#9a7b4f'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(0,-r*0.7); ctx.quadraticCurveTo(r*0.4,-r,r*0.2,-r*1.1); ctx.stroke();
  // spark
  const s=0.6+0.4*Math.sin(performance.now()/80);
  ctx.fillStyle=`rgba(255,170,40,${s})`;
  ctx.beginPath(); ctx.arc(r*0.2,-r*1.15,r*0.18,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.fillRect(r*0.15,-r*1.2,3,3);
  ctx.restore();
}
